services:
  registry:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      LISTEN_ADDR: ${LISTEN_ADDR:-:8080}
      STORAGE_ROOT: /var/lib/apk-registry
      REGISTRY_REPOSITORY: ${REGISTRY_REPOSITORY:-os}
      REGISTRY_PUBLIC_READ: ${REGISTRY_PUBLIC_READ:-true}
      REGISTRY_PUBLIC_URL: ${REGISTRY_PUBLIC_URL:-}
      REGISTRY_ADMIN_USERNAME: ${REGISTRY_ADMIN_USERNAME:?set REGISTRY_ADMIN_USERNAME}
      REGISTRY_ADMIN_PASSWORD: ${REGISTRY_ADMIN_PASSWORD:?set REGISTRY_ADMIN_PASSWORD}
      APK_INDEX_SIGNING_KEY: ${APK_INDEX_SIGNING_KEY:-}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-}
    volumes:
      - packages:/var/lib/apk-registry

volumes:
  packages:
