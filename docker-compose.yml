services:
  registry:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APK_REGISTRY_LISTEN_ADDR: ${APK_REGISTRY_LISTEN_ADDR:-:8080}
      APK_REGISTRY_STORAGE_ROOT: /var/lib/apk-registry
      APK_REGISTRY_REPOSITORY: ${APK_REGISTRY_REPOSITORY:-os}
      APK_REGISTRY_PUBLIC_READ: ${APK_REGISTRY_PUBLIC_READ:-true}
      APK_REGISTRY_PUBLIC_URL: ${APK_REGISTRY_PUBLIC_URL:-}
      APK_REGISTRY_ADMIN_USERNAME: ${APK_REGISTRY_ADMIN_USERNAME:?set APK_REGISTRY_ADMIN_USERNAME}
      APK_REGISTRY_ADMIN_PASSWORD: ${APK_REGISTRY_ADMIN_PASSWORD:?set APK_REGISTRY_ADMIN_PASSWORD}
      APK_REGISTRY_INDEX_SIGNING_KEY: ${APK_REGISTRY_INDEX_SIGNING_KEY:-}
      APK_REGISTRY_MAX_UPLOAD_SIZE: ${APK_REGISTRY_MAX_UPLOAD_SIZE:-}
    volumes:
      - packages:/var/lib/apk-registry

volumes:
  packages:
